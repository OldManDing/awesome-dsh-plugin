name: OldManDing/dsh-ledger-watch
category: agi
icon: https://raw.githubusercontent.com/OldManDing/dsh-ledger-watch/main/assets/icon-180.png
description:
  en: "Session-level lesson-ledger watch for DeepSeek Harness: shows whether a session actually consulted the ledger and recorded the pitfalls it hit, keeps the rule base's health visible (rules needing rework, rules already revised), and can inject the most relevant rules into the step as a system-reminder (high-confidence mode, off by default). Zero runtime dependencies; the browser half only needs React."
  zh: "会话级经验账本监视：显示本会话到底有没有查询经验、有没有记下踩过的坑，并把规则库健康度（失效待改、已修订）摆在明面上；可选把最相关的规则按任务注入上下文（高置信模式，默认关闭）。零运行时依赖，浏览器半边只需 React。"

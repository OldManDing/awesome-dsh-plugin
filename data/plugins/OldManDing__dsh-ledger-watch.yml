name: OldManDing/dsh-ledger-watch
category: memory
icon: https://raw.githubusercontent.com/OldManDing/dsh-ledger-watch/main/assets/icon-180.png
description:
  en: Watches this session's tool calls and reports whether the lesson ledger was checked, whether a pitfall was recorded, and which entries were written - in a tab and in a pill under the composer. Does not write the ledger and does not judge what counts as a pitfall.
  zh: 自动监测本会话的工具调用，判断有没有查经验账本、有没有记坑，并把「查了几次、记了几次、记了哪几条」实时显示在面板和输入框下方。它不写账本，也不判断什么算坑。